[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "torii-discord-bot"
version = "0.1.0"
description = "Discord bot for Torii (osu! private server), with Bathbot-style stats and OwO-style economy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Torii Team" }
]
dependencies = [
  "discord.py>=2.4.0,<3",
  "httpx>=0.27.0,<1",
  "aiosqlite>=0.20.0,<1",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
]

[project.scripts]
torii-discord-bot = "bot.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bot"]
